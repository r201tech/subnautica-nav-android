name: release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 准备 Android SDK
        run: |
          set -e
          SDKDIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDKDIR" > local.properties
          SDKM="$SDKDIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true
          fi

      - name: 读取版本号
        id: v
        run: |
          V=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "name=$V" >> $GITHUB_OUTPUT
          echo "versionName=$V"

      - name: 编译 debug APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace
          ls -l app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk "deepseanav-v${{ steps.v.outputs.name }}.apk"
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: 深海导航 v${{ steps.v.outputs.name }}
          body: |
            自动构建的 debug 签名 APK，下载后直接安装。

            使用前先装 Shizuku（或兼容服务并授权）；地图图片不随包分发，请自行放到 `/storage/emulated/0/DeepSeaNav/map.png`。
          files: deepseanav-v${{ steps.v.outputs.name }}.apk
          draft: false
          prerelease: false
